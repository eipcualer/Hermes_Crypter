name: Build Hermes Crypter

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test
        continue-on-error: true

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-web-dist
          path: dist/
          retention-days: 30

  build-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential

      - working-directory: cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - working-directory: cpp
        run: cmake --build build --config Release -j$(nproc)

      - working-directory: cpp
        run: |
          file build/obfmini
          ls -lh build/obfmini

      - uses: actions/upload-artifact@v4
        with:
          name: obfmini-linux-x64
          path: cpp/build/obfmini
          retention-days: 30

  build-cpp-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake

      - working-directory: cpp
        run: |
          cmake -B build-win \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release

      - working-directory: cpp
        run: cmake --build build-win --config Release -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: obfmini-windows-x64
          path: cpp/build-win/obfmini.exe
          retention-days: 30
